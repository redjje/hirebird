<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Get Paid to Rate Search Results for Google</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:#f8f8f5;color:#1a1a2e;line-height:1.6;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  .page{max-width:600px;margin:0 auto;padding:32px 20px 0;}

  .hero{text-align:center;padding-bottom:32px;}
  .google-logo{width:80px;height:80px;border-radius:16px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;background:#fff;box-shadow:0 4px 20px rgba(0,0,0,0.15);}
  .hero-headline{font-size:clamp(22px,5vw,28px);font-weight:800;line-height:1.2;margin-bottom:10px;color:#1a1a2e;}
  .hero-headline .company-color{color:var(--brand);}
  .hero-sub{font-size:15px;color:#555;margin-bottom:4px;}
  .hero-tagline{font-size:13.5px;color:#888;}

  .section{margin-bottom:36px;}
  .step-card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:16px 18px;margin-bottom:12px;}
  .step-title{font-size:14.5px;font-weight:700;color:#1a1a2e;margin-bottom:4px;}
  .step-desc{font-size:13.5px;color:var(--brand);}
  .step-desc.muted{color:#666;}
  .step-preview{background:#f0f4ff;border-radius:8px;padding:10px 12px;margin-top:10px;display:flex;align-items:center;gap:10px;border:1px solid #dde6ff;}
  .step-preview-logo{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#fff;font-size:20px;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,0.1);}
  .step-preview-text{flex:1;}
  .step-preview-name{font-size:12.5px;font-weight:700;color:#1a1a2e;}
  .step-preview-company{font-size:11.5px;color:#666;}
  .step-preview-hot{font-size:10px;font-weight:700;color:#fff;background:#e03131;border-radius:4px;padding:2px 6px;white-space:nowrap;}
  .step-preview-salary{font-size:12px;color:var(--brand);font-weight:600;margin-top:4px;}

  .cta-wrap{text-align:center;margin:8px 0 36px;}
  .btn-apply{display:inline-block;background:#1a3a8f;color:#fff;font-size:16px;font-weight:700;padding:15px 48px;border-radius:999px;cursor:pointer;border:none;font-family:inherit;transition:background .15s;}
  .btn-apply:hover{background:#122a6e;}
  .cta-note{font-size:12.5px;color:#888;margin-top:10px;}

  .section-title{font-size:20px;font-weight:800;text-align:center;margin-bottom:18px;color:#1a1a2e;}
  .section-title .company-color{color:var(--brand);}
  .benefit-card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:16px 18px;margin-bottom:10px;display:flex;align-items:center;gap:14px;}
  .benefit-icon{font-size:20px;width:32px;text-align:center;flex-shrink:0;}
  .benefit-title{font-size:14.5px;font-weight:700;color:#1a1a2e;margin-bottom:2px;}
  .benefit-desc{font-size:13px;color:var(--brand);}

  .check-card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:14px 18px;margin-bottom:10px;display:flex;align-items:center;gap:12px;font-size:14px;color:#1a1a2e;}
  .check-icon{font-size:16px;flex-shrink:0;color:var(--brand);}
  .check-icon.req{color:#d4920a;}

  .bottom-cta{text-align:center;padding:40px 20px;}
  .bottom-cta h2{font-size:22px;font-weight:800;margin-bottom:10px;}
  .bottom-cta p{font-size:14px;color:var(--brand);margin-bottom:24px;max-width:380px;margin-left:auto;margin-right:auto;}

  footer{text-align:center;padding:28px 20px;border-top:1px solid #e8e8e8;}
  footer p{font-size:12px;color:#999;}
</style>
</head>
<body>

<script>
const JOB = {
  pageTitle: "Get Paid to Rate Search Results for Google",
  companyName: "Google",
  companyColor: "#1a73e8",
  companyEmoji: "G",

  heroHeadline: "Get Paid to Rate Search Results for",
  heroSub: "Earn $30–$45/hour as a Remote Search Quality Rater",
  heroTagline: "Join thousands of people getting paid by Google to improve search results from home",

  steps: [
    {
      title: "Step 1 – Click Apply Now",
      desc: "Press the blue Apply Now button below. You'll be redirected to the official job portal.",
      muted: false
    },
    {
      title: "Step 2 – Fill in Your Basic Information",
      desc: "Fill in your details (name, contact info, etc.) — takes about 2 minutes.",
      muted: false
    },
    {
      title: "Step 3 – Find the Right Position",
      desc: "Browse the job list and select:",
      muted: false,
      previewJobTitle: "Remote Search Quality Rater",
      previewCompany: "Google",
      previewSalary: "$30–$45/hr",
      showHot: true
    },
    {
      title: "Step 4 – Submit Your Application",
      desc: "Complete the application form carefully and make sure all information is correct.",
      muted: true
    },
    {
      title: "Step 5 – Didn't Get Accepted? Try Again",
      desc: "Sometimes applications are declined for small mistakes or high demand. You can reapply and submit a new application.",
      muted: true
    }
  ],

  benefits: [
    { icon: "💰", title: "$30–$45/Hour",          desc: "Competitive pay for rating search results remotely" },
    { icon: "🏠", title: "Work From Home",         desc: "Fully remote — work from anywhere in the USA" },
    { icon: "🕐", title: "Full Time / Part Time",  desc: "Flexible schedule — set your own hours" },
    { icon: "🔍", title: "Help Shape Google Search", desc: "Your feedback directly improves results for millions" },
    { icon: "🎓", title: "No Experience Needed",   desc: "Entry level — full training provided by Google" }
  ],

  tasks: [
    "Evaluate the quality and relevance of Google search results",
    "Rate websites based on accuracy, trustworthiness, and usefulness",
    "Test online search features and report usability issues",
    "Review search queries and assess how well results match intent",
    "Provide detailed feedback using Google's rating guidelines",
    "Complete structured evaluation tasks via a simple online tool"
  ],

  requirements: [
    "U.S. resident (18 years or older)",
    "Reliable high-speed internet connection",
    "Phone, laptop, or computer",
    "No experience needed — training provided",
    "Good reading comprehension and attention to detail",
    "Available at least 5–10 hours per week"
  ],

  closingTitle: "Ready to Get Paid by Google From Home?",
  closingDesc: "Join Google's remote Search Quality team and earn great pay while improving the world's most-used search engine.",

  applyUrl: "https://giftclick.org/aff_c?offer_id=1373&aff_id=2274&source=hibird2",

  footerText: "Google Remote Search Quality Rater © 2026"
};

document.title = JOB.pageTitle;
document.documentElement.style.setProperty('--brand', JOB.companyColor);

document.addEventListener('DOMContentLoaded', () => {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="page">
      <div class="hero">
        <div class="google-logo">
          <svg width="46" height="46" viewBox="0 0 46 46" xmlns="http://www.w3.org/2000/svg">
            <path d="M46 23.5c0-1.3-.11-2.56-.32-3.78H23.5v7.15h12.64c-.55 2.96-2.2 5.47-4.68 7.16v5.95h7.58C43.06 36.3 46 30.36 46 23.5z" fill="#4285F4"/>
            <path d="M23.5 47c6.34 0 11.66-2.1 15.54-5.7l-7.58-5.95c-2.1 1.41-4.79 2.24-7.96 2.24-6.12 0-11.3-4.13-13.15-9.69H2.5v6.14C6.37 42.92 14.34 47 23.5 47z" fill="#34A853"/>
            <path d="M10.35 27.9A13.97 13.97 0 0 1 9.5 23.5c0-1.53.26-3.01.85-4.4v-6.14H2.5A23.5 23.5 0 0 0 0 23.5c0 3.79.91 7.38 2.5 10.54l7.85-6.14z" fill="#FBBC05"/>
            <path d="M23.5 9.37c3.45 0 6.54 1.19 8.98 3.51l6.73-6.73C35.14 2.35 29.83 0 23.5 0 14.34 0 6.37 4.08 2.5 10.96l7.85 6.14C12.2 13.5 17.38 9.37 23.5 9.37z" fill="#EA4335"/>
          </svg>
        </div>
        <h1 class="hero-headline">${JOB.heroHeadline} <span class="company-color">${JOB.companyName}</span></h1>
        <p class="hero-sub">${JOB.heroSub}</p>
        <p class="hero-tagline">${JOB.heroTagline}</p>
      </div>

      <div class="section">
        ${JOB.steps.map(s => `
          <div class="step-card">
            <div class="step-title">${s.title}</div>
            <div class="step-desc${s.muted?' muted':''}">${s.desc}</div>
            ${s.previewJobTitle ? `
            <p style="font-size:13px;margin-top:6px;">👉 <span style="color:var(--brand);font-weight:600;">${s.previewJobTitle}</span></p>
            <div class="step-preview">
              <div class="step-preview-logo"><svg width="20" height="20" viewBox="0 0 46 46" xmlns="http://www.w3.org/2000/svg"><path d="M46 23.5c0-1.3-.11-2.56-.32-3.78H23.5v7.15h12.64c-.55 2.96-2.2 5.47-4.68 7.16v5.95h7.58C43.06 36.3 46 30.36 46 23.5z" fill="#4285F4"/><path d="M23.5 47c6.34 0 11.66-2.1 15.54-5.7l-7.58-5.95c-2.1 1.41-4.79 2.24-7.96 2.24-6.12 0-11.3-4.13-13.15-9.69H2.5v6.14C6.37 42.92 14.34 47 23.5 47z" fill="#34A853"/><path d="M10.35 27.9A13.97 13.97 0 0 1 9.5 23.5c0-1.53.26-3.01.85-4.4v-6.14H2.5A23.5 23.5 0 0 0 0 23.5c0 3.79.91 7.38 2.5 10.54l7.85-6.14z" fill="#FBBC05"/><path d="M23.5 9.37c3.45 0 6.54 1.19 8.98 3.51l6.73-6.73C35.14 2.35 29.83 0 23.5 0 14.34 0 6.37 4.08 2.5 10.96l7.85 6.14C12.2 13.5 17.38 9.37 23.5 9.37z" fill="#EA4335"/></svg></div>
              <div class="step-preview-text">
                <div class="step-preview-name">${s.previewJobTitle}</div>
                <div class="step-preview-company">${s.previewCompany}</div>
                <div class="step-preview-salary">${s.previewSalary}</div>
              </div>
              ${s.showHot ? `<span class="step-preview-hot">🔥 HOT</span>` : ''}
            </div>` : ''}
          </div>
        `).join('')}
      </div>

      <div class="cta-wrap">
        <a href="${JOB.applyUrl}" class="btn-apply" target="_blank" rel="noopener">Apply Now</a>
        <p class="cta-note">Limited positions available • No experience required</p>
      </div>

      <div class="section">
        <h2 class="section-title">Why Work With <span class="company-color">${JOB.companyName}</span>?</h2>
        ${JOB.benefits.map(b => `
          <div class="benefit-card">
            <div class="benefit-icon">${b.icon}</div>
            <div>
              <div class="benefit-title">${b.title}</div>
              <div class="benefit-desc">${b.desc}</div>
            </div>
          </div>
        `).join('')}
      </div>

      <div class="section">
        <h2 class="section-title">What You'll Do</h2>
        ${JOB.tasks.map(t => `
          <div class="check-card">
            <span class="check-icon">✅</span>
            ${t}
          </div>
        `).join('')}
      </div>

      <div class="section">
        <h2 class="section-title">Requirements</h2>
        ${JOB.requirements.map(r => `
          <div class="check-card">
            <span class="check-icon req">🔔</span>
            ${r}
          </div>
        `).join('')}
      </div>

      <div class="bottom-cta">
        <h2>${JOB.closingTitle}</h2>
        <p>${JOB.closingDesc}</p>
        <a href="${JOB.applyUrl}" class="btn-apply" target="_blank" rel="noopener">Apply Now</a>
      </div>
    </div>

    <footer>
      <svg width="36" height="36" viewBox="0 0 46 46" xmlns="http://www.w3.org/2000/svg" style="margin:0 auto 8px;display:block;"><path d="M46 23.5c0-1.3-.11-2.56-.32-3.78H23.5v7.15h12.64c-.55 2.96-2.2 5.47-4.68 7.16v5.95h7.58C43.06 36.3 46 30.36 46 23.5z" fill="#4285F4"/><path d="M23.5 47c6.34 0 11.66-2.1 15.54-5.7l-7.58-5.95c-2.1 1.41-4.79 2.24-7.96 2.24-6.12 0-11.3-4.13-13.15-9.69H2.5v6.14C6.37 42.92 14.34 47 23.5 47z" fill="#34A853"/><path d="M10.35 27.9A13.97 13.97 0 0 1 9.5 23.5c0-1.53.26-3.01.85-4.4v-6.14H2.5A23.5 23.5 0 0 0 0 23.5c0 3.79.91 7.38 2.5 10.54l7.85-6.14z" fill="#FBBC05"/><path d="M23.5 9.37c3.45 0 6.54 1.19 8.98 3.51l6.73-6.73C35.14 2.35 29.83 0 23.5 0 14.34 0 6.37 4.08 2.5 10.96l7.85 6.14C12.2 13.5 17.38 9.37 23.5 9.37z" fill="#EA4335"/></svg>
      <p>${JOB.footerText}</p>
    </footer>
  `;
});
</script>

<div id="app"></div>

</body>
</html>
