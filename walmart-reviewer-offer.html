<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Get Paid to Review Products for Walmart</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:#f8f8f5;color:#1a1a2e;line-height:1.6;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  .page{max-width:600px;margin:0 auto;padding:32px 20px 0;}

  .hero{text-align:center;padding-bottom:32px;}
  .company-logo-placeholder{width:80px;height:80px;border-radius:16px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;background:#0071ce;box-shadow:0 4px 20px rgba(0,113,206,0.3);}
  .hero-headline{font-size:clamp(22px,5vw,28px);font-weight:800;line-height:1.2;margin-bottom:10px;color:#1a1a2e;}
  .hero-headline .company-color{color:#ffc220;}
  .hero-sub{font-size:15px;color:#555;margin-bottom:4px;}
  .hero-tagline{font-size:13.5px;color:#888;}

  .section{margin-bottom:36px;}
  .step-card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:16px 18px;margin-bottom:12px;}
  .step-title{font-size:14.5px;font-weight:700;color:#1a1a2e;margin-bottom:4px;}
  .step-desc{font-size:13.5px;color:#0071ce;}
  .step-desc.muted{color:#666;}

  .cta-wrap{text-align:center;margin:8px 0 36px;}
  .btn-apply{display:inline-block;background:#1a3a8f;color:#fff;font-size:16px;font-weight:700;padding:15px 48px;border-radius:999px;cursor:pointer;border:none;font-family:inherit;transition:background .15s;}
  .btn-apply:hover{background:#122a6e;}
  .cta-note{font-size:12.5px;color:#888;margin-top:10px;}

  .section-title{font-size:20px;font-weight:800;text-align:center;margin-bottom:18px;color:#1a1a2e;}
  .section-title .company-color{color:#ffc220;}

  .benefit-card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:16px 18px;margin-bottom:10px;display:flex;align-items:center;gap:14px;}
  .benefit-icon{font-size:20px;width:32px;text-align:center;flex-shrink:0;}
  .benefit-title{font-size:14.5px;font-weight:700;color:#1a1a2e;margin-bottom:2px;}
  .benefit-desc{font-size:13px;color:#0071ce;}

  .check-card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:14px 18px;margin-bottom:10px;display:flex;align-items:center;gap:12px;font-size:14px;color:#1a1a2e;}
  .check-icon{font-size:16px;flex-shrink:0;color:#0071ce;}
  .check-icon.req{color:#d4920a;}

  .bottom-cta{text-align:center;padding:40px 20px;}
  .bottom-cta h2{font-size:22px;font-weight:800;margin-bottom:10px;}
  .bottom-cta p{font-size:14px;color:#0071ce;margin-bottom:24px;max-width:380px;margin-left:auto;margin-right:auto;}

  footer{text-align:center;padding:28px 20px;border-top:1px solid #e8e8e8;}
  footer p{font-size:12px;color:#999;}
</style>
</head>
<body>
<script>
const JOB = {
  pageTitle: "Get Paid to Review Products for Walmart",
  companyName: "Walmart",
  companyColor: "#ffc220",

  heroHeadline: "Get Paid to Review Products for",
  heroSub: "Earn up to $750 per reviewed product",
  heroTagline: "Join thousands of shoppers getting paid to review Walmart products",

  steps: [
    {
      title: "Step 1 – Click Apply",
      desc: "Press the blue Apply Now button below. You'll be taken to the registration page.",
      muted: false
    },
    {
      title: "Step 2 – Enter Your Basic Information",
      desc: "Fill in a few quick details to create your reviewer profile — takes under 2 minutes.",
      muted: false
    },
    {
      title: "Step 3 – Explore & Review Deals/Products",
      desc: "Browse available Walmart product deals from your dashboard and complete reviews at your own pace. The more deals you complete, the more you earn.",
      muted: false
    },
    {
      title: "Step 4 – Get Paid",
      desc: "Earnings are released after each completed review. No cap — review as many products as you want.",
      muted: false
    }
  ],

  benefits: [
    { icon: "💰", title: "Up to $750 Per Product",  desc: "Paid per completed product review — not per hour" },
    { icon: "🏠", title: "Work From Home",           desc: "Review products from anywhere in the country" },
    { icon: "🕐", title: "Flexible Hours",           desc: "Choose your own schedule, review at your pace" },
    { icon: "🛍️", title: "Keep the Products",        desc: "Most items are yours to keep after reviewing" }
  ],

  tasks: [
    "Receive and test Walmart products at home",
    "Write detailed, honest reviews (200+ words)",
    "Rate products on quality, value, and usability",
    "Upload photos of products you've tested",
    "Provide feedback on packaging and delivery experience"
  ],

  requirements: [
    "Must be 18+ and located in the United States",
    "Reliable internet connection and a smartphone or computer",
    "Strong written communication skills",
    "Ability to provide honest, unbiased feedback",
    "Attention to detail when evaluating products"
  ],

  closingTitle: "Ready to Start Getting Paid to Review?",
  closingDesc: "Join Walmart's product reviewer program and earn great pay while keeping the products you love.",

  applyUrl: "https://linkthem.net/aff_c?offer_id=1157&aff_id=2274&source=hibird2",

  footerText: "Walmart Reviewer Program © 2026. All rights reserved."
};

document.title = JOB.pageTitle;

document.addEventListener('DOMContentLoaded', () => {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="page">
      <div class="hero">
        <div style="text-align:center;">
          <div class="company-logo-placeholder" style="font-size:36px;font-weight:800;color:#fff;font-family:'Inter',sans-serif;">W</div>
        </div>
        <h1 class="hero-headline">${JOB.heroHeadline} <span class="company-color">${JOB.companyName}</span></h1>
        <p class="hero-sub">${JOB.heroSub}</p>
        <p class="hero-tagline">${JOB.heroTagline}</p>
      </div>

      <div class="section">
        ${JOB.steps.map(s => `
          <div class="step-card">
            <div class="step-title">${s.title}</div>
            <div class="step-desc${s.muted?' muted':''}">${s.desc}</div>
          </div>
        `).join('')}
      </div>

      <div class="cta-wrap">
        <a href="${JOB.applyUrl}" class="btn-apply" target="_blank" rel="noopener">Apply Now</a>
        <p class="cta-note">Limited positions available • No experience required</p>
      </div>

      <div class="section">
        <h2 class="section-title">Why Review for <span class="company-color">${JOB.companyName}</span>?</h2>
        ${JOB.benefits.map(b => `
          <div class="benefit-card">
            <div class="benefit-icon">${b.icon}</div>
            <div>
              <div class="benefit-title">${b.title}</div>
              <div class="benefit-desc">${b.desc}</div>
            </div>
          </div>
        `).join('')}
      </div>

      <div class="section">
        <h2 class="section-title">What You'll Do</h2>
        ${JOB.tasks.map(t => `
          <div class="check-card">
            <span class="check-icon">✅</span>
            ${t}
          </div>
        `).join('')}
      </div>

      <div class="section">
        <h2 class="section-title">Requirements</h2>
        ${JOB.requirements.map(r => `
          <div class="check-card">
            <span class="check-icon req">🔔</span>
            ${r}
          </div>
        `).join('')}
      </div>

      <div class="bottom-cta">
        <h2>${JOB.closingTitle}</h2>
        <p>${JOB.closingDesc}</p>
        <a href="${JOB.applyUrl}" class="btn-apply" target="_blank" rel="noopener">Apply Now</a>
      </div>
    </div>

    <footer>
      <div style="width:36px;height:36px;border-radius:8px;background:#0071ce;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:18px;font-weight:800;color:#ffc220;font-family:'Inter',sans-serif;">W</div>
      <p>${JOB.footerText}</p>
    </footer>
  `;
});
</script>
<div id="app"></div>
</body>
</html>
