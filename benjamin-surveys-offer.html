<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Get Paid to Take Surveys — Benjamin App</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:#f8f8f5;color:#1a1a2e;line-height:1.6;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  .page{max-width:600px;margin:0 auto;padding:32px 20px 0;}

  .hero{text-align:center;padding-bottom:32px;}
  .company-badge{width:80px;height:80px;border-radius:20px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6c3fc5,#9b5de5);box-shadow:0 4px 24px rgba(108,63,197,0.35);}
  .hero-headline{font-size:clamp(22px,5vw,28px);font-weight:800;line-height:1.2;margin-bottom:10px;color:#1a1a2e;}
  .hero-headline .company-color{color:var(--brand);}
  .hero-sub{font-size:15px;color:#555;margin-bottom:4px;}
  .hero-tagline{font-size:13.5px;color:#888;}

  .social-proof{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:14px 18px;margin-bottom:28px;text-align:center;font-size:14px;color:#444;}
  .social-proof strong{color:var(--brand);}

  .section{margin-bottom:36px;}
  .step-card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:16px 18px;margin-bottom:12px;}
  .step-title{font-size:14.5px;font-weight:700;color:#1a1a2e;margin-bottom:4px;}
  .step-desc{font-size:13.5px;color:var(--brand);}
  .step-desc.muted{color:#666;}

  .cta-wrap{text-align:center;margin:8px 0 36px;}
  .btn-apply{display:inline-block;background:#6c3fc5;color:#fff;font-size:16px;font-weight:700;padding:15px 48px;border-radius:999px;cursor:pointer;border:none;font-family:inherit;transition:background .15s;box-shadow:0 6px 20px rgba(108,63,197,0.3);}
  .btn-apply:hover{background:#5a32a3;}
  .cta-note{font-size:12.5px;color:#888;margin-top:10px;}

  .section-title{font-size:20px;font-weight:800;text-align:center;margin-bottom:18px;color:#1a1a2e;}
  .section-title .company-color{color:var(--brand);}
  .benefit-card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:16px 18px;margin-bottom:10px;display:flex;align-items:center;gap:14px;}
  .benefit-icon{font-size:20px;width:32px;text-align:center;flex-shrink:0;}
  .benefit-title{font-size:14.5px;font-weight:700;color:#1a1a2e;margin-bottom:2px;}
  .benefit-desc{font-size:13px;color:var(--brand);}

  .check-card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:14px 18px;margin-bottom:10px;display:flex;align-items:center;gap:12px;font-size:14px;color:#1a1a2e;}
  .check-icon{font-size:16px;flex-shrink:0;color:var(--brand);}
  .check-icon.req{color:#d4920a;}

  .faq-card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:16px 18px;margin-bottom:10px;}
  .faq-q{font-size:14px;font-weight:700;color:#1a1a2e;margin-bottom:6px;}
  .faq-a{font-size:13.5px;color:#555;}

  .bottom-cta{text-align:center;padding:40px 20px;}
  .bottom-cta h2{font-size:22px;font-weight:800;margin-bottom:10px;}
  .bottom-cta p{font-size:14px;color:var(--brand);margin-bottom:24px;max-width:380px;margin-left:auto;margin-right:auto;}

  footer{text-align:center;padding:28px 20px;border-top:1px solid #e8e8e8;}
  footer p{font-size:12px;color:#999;}
</style>
</head>
<body>
<script>
const JOB = {
  pageTitle: "Get Paid to Take Surveys — Benjamin App",
  companyName: "Benjamin",
  companyColor: "#6c3fc5",

  heroHeadline: "Your Feedback Pays Off —",
  heroHeadline2: "Get Paid to Take Surveys",
  heroSub: "Complete quick surveys and earn real cash rewards",
  heroTagline: "Share your opinions, get paid — cash out anytime via bank transfer or gift cards",

  socialProof: "Benjamin has helped users earn over <strong>$5 million</strong> in rewards",

  steps: [
    {
      title: "Step 1 – Click Apply Now",
      desc: "Press the button below and download the Benjamin App — it's completely free to join.",
      muted: false
    },
    {
      title: "Step 2 – Create Your Free Account",
      desc: "Sign up in minutes and join a community of survey takers already earning real cash.",
      muted: false
    },
    {
      title: "Step 3 – Explore & Complete Surveys",
      desc: "Choose from a variety of surveys that match your interests and start sharing your opinions. The more you complete, the more you earn.",
      muted: false
    },
    {
      title: "Step 4 – Cash Out Anytime",
      desc: "Redeem your earnings for cash via bank transfer, PayPal, or gift cards — no minimum wait.",
      muted: false
    }
  ],

  benefits: [
    { icon: "💰", title: "Real Cash Earnings",     desc: "Your opinions translate directly into rewards you can withdraw" },
    { icon: "🏠", title: "Work From Anywhere",     desc: "Complete surveys from your phone, tablet, or computer" },
    { icon: "🕐", title: "Flexible Schedule",      desc: "No deadlines — take surveys whenever you have free time" },
    { icon: "🎁", title: "Multiple Payout Options", desc: "Bank transfer, PayPal, or gift cards — your choice" },
    { icon: "📊", title: "Many Survey Topics",     desc: "Products, services, lifestyle, trends — always something new" },
    { icon: "🎓", title: "No Experience Needed",   desc: "Anyone can join — just share your honest opinions" }
  ],

  tasks: [
    "Complete short surveys on products, services, and trends",
    "Share your honest opinions on everyday topics",
    "Rate brands and experiences from your daily life",
    "Participate in market research for top companies",
    "Earn rewards with every survey you finish"
  ],

  requirements: [
    "18 years or older",
    "U.S. resident",
    "Smartphone, tablet, or computer",
    "Reliable internet connection",
    "No experience required — just your honest opinions"
  ],

  faqs: [
    {
      q: "How much can I earn from taking surveys?",
      a: "Earnings vary by survey length and topic. The more surveys you complete, the more you earn — there's no cap on how much you can make."
    },
    {
      q: "How do I receive my rewards?",
      a: "You can cash out via bank transfer or gift cards. Payouts are processed quickly once you reach the minimum threshold."
    },
    {
      q: "Is there a limit to how many surveys I can take?",
      a: "No — you can take as many surveys as are available to you. More surveys = more earnings."
    }
  ],

  closingTitle: "Ready to Turn Your Opinions Into Cash?",
  closingDesc: "Join thousands of people already earning with Benjamin. It's free, flexible, and pays real money.",

  applyUrl: "https://giftclick.org/aff_c?offer_id=3925&aff_id=2274&source=hibird2",

  footerText: "© 2026 Benjamin App. All rights reserved."
};

document.title = JOB.pageTitle;
document.documentElement.style.setProperty('--brand', JOB.companyColor);

document.addEventListener('DOMContentLoaded', () => {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="page">
      <div class="hero">
        <div style="text-align:center;">
          <div class="company-badge">
            <span style="font-family:'Inter',sans-serif;font-weight:800;font-size:28px;color:#fff;">B</span>
          </div>
        </div>
        <h1 class="hero-headline">${JOB.heroHeadline}<br><span class="company-color">${JOB.heroHeadline2}</span></h1>
        <p class="hero-sub">${JOB.heroSub}</p>
        <p class="hero-tagline">${JOB.heroTagline}</p>
      </div>

      <div class="social-proof">${JOB.socialProof}</div>

      <div class="section">
        ${JOB.steps.map(s => `
          <div class="step-card">
            <div class="step-title">${s.title}</div>
            <div class="step-desc${s.muted?' muted':''}">${s.desc}</div>
          </div>
        `).join('')}
      </div>

      <div class="cta-wrap">
        <a href="${JOB.applyUrl}" class="btn-apply" target="_blank" rel="noopener">Apply Now — It's Free</a>
        <p class="cta-note">No experience required • Cash out anytime</p>
      </div>

      <div class="section">
        <h2 class="section-title">Why Choose <span class="company-color">${JOB.companyName}</span>?</h2>
        ${JOB.benefits.map(b => `
          <div class="benefit-card">
            <div class="benefit-icon">${b.icon}</div>
            <div>
              <div class="benefit-title">${b.title}</div>
              <div class="benefit-desc">${b.desc}</div>
            </div>
          </div>
        `).join('')}
      </div>

      <div class="section">
        <h2 class="section-title">What You'll Do</h2>
        ${JOB.tasks.map(t => `
          <div class="check-card">
            <span class="check-icon">✅</span>
            ${t}
          </div>
        `).join('')}
      </div>

      <div class="section">
        <h2 class="section-title">Requirements</h2>
        ${JOB.requirements.map(r => `
          <div class="check-card">
            <span class="check-icon req">🔔</span>
            ${r}
          </div>
        `).join('')}
      </div>

      <div class="section">
        <h2 class="section-title">Frequently Asked Questions</h2>
        ${JOB.faqs.map(f => `
          <div class="faq-card">
            <div class="faq-q">❓ ${f.q}</div>
            <div class="faq-a">${f.a}</div>
          </div>
        `).join('')}
      </div>

      <div class="bottom-cta">
        <h2>${JOB.closingTitle}</h2>
        <p>${JOB.closingDesc}</p>
        <a href="${JOB.applyUrl}" class="btn-apply" target="_blank" rel="noopener">Apply Now — It's Free</a>
      </div>
    </div>

    <footer>
      <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#6c3fc5,#9b5de5);display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-weight:800;font-size:16px;color:#fff;">B</div>
      <p>${JOB.footerText}</p>
    </footer>
  `;
});
</script>
<div id="app"></div>
</body>
</html>
