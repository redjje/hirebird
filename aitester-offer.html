<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Get Paid as a Remote A.I. Tester – $45–$75/hr</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:#f8f8f5;color:#1a1a2e;line-height:1.6;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  .page{max-width:600px;margin:0 auto;padding:32px 20px 0;}

  .hero{text-align:center;padding-bottom:32px;}
  .company-badge{border-radius:16px;margin:0 auto 18px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 4px 24px rgba(0,0,0,0.12);background:linear-gradient(135deg,#0f2460,#1a3a8f);width:80px;height:80px;}
  .hero-headline{font-size:clamp(22px,5vw,28px);font-weight:800;line-height:1.2;margin-bottom:10px;color:#1a1a2e;}
  .hero-headline .company-color{color:var(--brand);}
  .hero-sub{font-size:15px;color:#555;margin-bottom:4px;}
  .hero-tagline{font-size:13.5px;color:#888;}

  .urgency-bar{background:#fff3cd;border:1px solid #ffc107;border-radius:10px;padding:12px 16px;text-align:center;font-size:13.5px;font-weight:600;color:#856404;margin-bottom:28px;}

  .section{margin-bottom:36px;}
  .step-card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:16px 18px;margin-bottom:12px;}
  .step-title{font-size:14.5px;font-weight:700;color:#1a1a2e;margin-bottom:4px;}
  .step-desc{font-size:13.5px;color:var(--brand);}
  .step-desc.muted{color:#666;}
  .step-preview{background:#f0f4ff;border-radius:8px;padding:10px 12px;margin-top:10px;display:flex;align-items:center;gap:10px;border:1px solid #dde6ff;}
  .step-preview-badge{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:linear-gradient(135deg,#0f2460,#1a3a8f);}
  .step-preview-text{flex:1;}
  .step-preview-name{font-size:12.5px;font-weight:700;color:#1a1a2e;}
  .step-preview-company{font-size:11.5px;color:#666;}
  .step-preview-hot{font-size:10px;font-weight:700;color:#fff;background:#e03131;border-radius:4px;padding:2px 6px;white-space:nowrap;}
  .step-preview-salary{font-size:12px;color:var(--brand);font-weight:600;margin-top:4px;}

  .cta-wrap{text-align:center;margin:8px 0 36px;}
  .btn-apply{display:inline-block;background:#1a3a8f;color:#fff;font-size:16px;font-weight:700;padding:15px 48px;border-radius:999px;cursor:pointer;border:none;font-family:inherit;transition:background .15s;}
  .btn-apply:hover{background:#122a6e;}
  .cta-note{font-size:12.5px;color:#e03131;margin-top:10px;font-weight:600;}

  .section-title{font-size:20px;font-weight:800;text-align:center;margin-bottom:18px;color:#1a1a2e;}
  .section-title .company-color{color:var(--brand);}

  .benefit-card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:16px 18px;margin-bottom:10px;display:flex;align-items:center;gap:14px;}
  .benefit-icon{font-size:20px;width:32px;text-align:center;flex-shrink:0;}
  .benefit-title{font-size:14.5px;font-weight:700;color:#1a1a2e;margin-bottom:2px;}
  .benefit-desc{font-size:13px;color:var(--brand);}

  .check-card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:14px 18px;margin-bottom:10px;display:flex;align-items:center;gap:12px;font-size:14px;color:#1a1a2e;}
  .check-icon{font-size:16px;flex-shrink:0;}

  .training-card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:20px;margin-bottom:12px;}
  .training-card h4{font-size:15px;font-weight:700;margin-bottom:12px;color:#1a1a2e;}
  .training-item{display:flex;align-items:center;gap:10px;font-size:13.5px;color:#444;margin-bottom:8px;}

  .bottom-cta{text-align:center;padding:40px 20px;}
  .bottom-cta h2{font-size:22px;font-weight:800;margin-bottom:10px;}
  .bottom-cta p{font-size:14px;color:var(--brand);margin-bottom:24px;max-width:380px;margin-left:auto;margin-right:auto;}

  footer{text-align:center;padding:28px 20px;border-top:1px solid #e8e8e8;}
  footer p{font-size:12px;color:#999;}
</style>
</head>
<body>

<script>
const JOB = {
  pageTitle: "Remote A.I. Tester – $45–$75/hr | EarnFlow",
  companyName: "EarnFlow",
  companyColor: "#1a3a8f",

  heroHeadline: "Get Paid to Test A.I. Software —",
  heroHeadline2: "From Home",
  heroSub: "Earn $45–$75/hour as a Remote A.I. Tester",
  heroTagline: "Help companies improve cutting-edge A.I. software — no experience needed",

  urgency: "⚠️ Limited daily approvals available — positions are filling quickly!",

  steps: [
    {
      title: "Step 1 – Click Apply Now",
      desc: "Press the blue Apply Now button below. You'll be taken to the access page where you can watch the short video.",
      muted: false
    },
    {
      title: "Step 2 – Watch the Short Video",
      desc: "On the next page, press play and watch the full video. It explains exactly how the system works and what you'll be doing as an A.I. Tester.",
      muted: false
    },
    {
      title: "Step 3 – Claim Your Access",
      desc: "After watching, click the button on the page to claim your spot. Follow the simple instructions to complete your registration.",
      muted: false
    },
    {
      title: "Step 4 – Complete Your Training",
      desc: "Self-paced training is provided after signup — typically done within 24 hours. No exams, no tests. Certification provided upon completion.",
      muted: false
    },
    {
      title: "Step 5 – Start Accepting Paid Tasks",
      desc: "Once approved and trained, you'll begin receiving paid A.I. testing tasks. Work when you want, earn daily or weekly.",
      muted: false
    }
  ],

  benefits: [
    { icon: "💰", title: "$45–$75/Hour",           desc: "Daily or weekly payouts — bank deposit, PayPal, or check" },
    { icon: "🏠", title: "Fully Remote",            desc: "No commute, no office — work from anywhere" },
    { icon: "🕐", title: "Flexible Schedule",       desc: "Work when and where you want, on your own terms" },
    { icon: "🎓", title: "No Experience Needed",    desc: "Full training provided — beginners welcome" },
    { icon: "🤖", title: "Be Part of A.I. Growth",  desc: "The A.I. industry is booming — demand exceeds supply right now" }
  ],

  tasks: [
    "Test A.I. software by following step-by-step instructions",
    "Interact with A.I. tools through basic prompts and conversations",
    "Identify bugs or issues and submit simple reports",
    "Follow copy-and-paste tasks provided by companies",
    "Help businesses improve their A.I. products",
    "Complete structured evaluations at your own pace"
  ],

  whoItsFor: [
    "Beginners looking for remote income",
    "Anyone seeking flexible side income or full-time remote work",
    "No technical or coding experience required",
    "Comfortable using a phone, laptop, and the internet",
    "Interested in adopting A.I. tools"
  ],

  requirements: [
    "U.S. or Canadian resident",
    "Must complete a short qualification survey",
    "Reliable internet connection",
    "Phone, tablet, or computer",
    "No experience needed — training provided"
  ],

  training: [
    { icon: "📘", text: "Short online training provided after approval" },
    { icon: "⏳", text: "Self-paced — typically completed within 24 hours" },
    { icon: "❌", text: "No exams or tests" },
    { icon: "🏅", text: "Certification provided upon completion" }
  ],

  closingTitle: "Ready to Start Earning with A.I.?",
  closingDesc: "Apply today and join thousands of remote testers helping shape the future of artificial intelligence.",

  applyUrl: "https://www.glowp.site/P2C8M62/BL9L19R/?source_id=hibird2",

  footerText: "EarnFlow Remote A.I. Tester © 2026"
};

document.title = JOB.pageTitle;
document.documentElement.style.setProperty('--brand', JOB.companyColor);

document.addEventListener('DOMContentLoaded', () => {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="page">
      <div class="hero">
        <div style="text-align:center;">
          <div class="company-badge">
            <span style="font-size:32px;">🤖</span>
          </div>
        </div>
        <h1 class="hero-headline">${JOB.heroHeadline} <span class="company-color">${JOB.heroHeadline2}</span></h1>
        <p class="hero-sub">${JOB.heroSub}</p>
        <p class="hero-tagline">${JOB.heroTagline}</p>
      </div>

      <div class="urgency-bar">${JOB.urgency}</div>

      <div class="section">
        ${JOB.steps.map(s => `
          <div class="step-card">
            <div class="step-title">${s.title}</div>
            <div class="step-desc${s.muted?' muted':''}">${s.desc}</div>
            ${s.previewJobTitle ? `
            <p style="font-size:13px;margin-top:6px;">👉 <span style="color:var(--brand);font-weight:600;">${s.previewJobTitle}</span></p>
            <div class="step-preview">
              <div class="step-preview-badge"><span style="font-size:18px;">🤖</span></div>
              <div class="step-preview-text">
                <div class="step-preview-name">${s.previewJobTitle}</div>
                <div class="step-preview-company">${s.previewCompany}</div>
                <div class="step-preview-salary">${s.previewSalary}</div>
              </div>
              ${s.showHot ? `<span class="step-preview-hot">🔥 HOT</span>` : ''}
            </div>` : ''}
          </div>
        `).join('')}
      </div>

      <div class="cta-wrap">
        <a href="${JOB.applyUrl}" class="btn-apply" target="_blank" rel="noopener">Apply Now</a>
        <p class="cta-note">⚠️ Limited daily approvals — don't wait!</p>
      </div>

      <div class="section">
        <h2 class="section-title">💰 Pay & Benefits</h2>
        ${JOB.benefits.map(b => `
          <div class="benefit-card">
            <div class="benefit-icon">${b.icon}</div>
            <div>
              <div class="benefit-title">${b.title}</div>
              <div class="benefit-desc">${b.desc}</div>
            </div>
          </div>
        `).join('')}
      </div>

      <div class="section">
        <h2 class="section-title">🧠 What You'll Be Doing</h2>
        ${JOB.tasks.map(t => `
          <div class="check-card">
            <span class="check-icon">✅</span>
            ${t}
          </div>
        `).join('')}
      </div>

      <div class="section">
        <h2 class="section-title">👥 Who This Is For</h2>
        ${JOB.whoItsFor.map(w => `
          <div class="check-card">
            <span class="check-icon">🌱</span>
            ${w}
          </div>
        `).join('')}
      </div>

      <div class="section">
        <h2 class="section-title">📋 Requirements</h2>
        ${JOB.requirements.map(r => `
          <div class="check-card">
            <span class="check-icon" style="color:#d4920a;">🔔</span>
            ${r}
          </div>
        `).join('')}
      </div>

      <div class="section">
        <div class="training-card">
          <h4>🎓 Training</h4>
          ${JOB.training.map(t => `
            <div class="training-item">
              <span>${t.icon}</span>
              <span>${t.text}</span>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="bottom-cta">
        <h2>${JOB.closingTitle}</h2>
        <p>${JOB.closingDesc}</p>
        <a href="${JOB.applyUrl}" class="btn-apply" target="_blank" rel="noopener">Apply Now</a>
        <p class="cta-note" style="margin-top:14px;">👉 Apply Today – Positions Are Filling Quickly</p>
      </div>
    </div>

    <footer>
      <p style="font-size:24px;margin-bottom:6px;">🤖</p>
      <p>${JOB.footerText}</p>
    </footer>
  `;
});
</script>

<div id="app"></div>

</body>
</html>
